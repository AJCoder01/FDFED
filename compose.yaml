services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub_dev
      POSTGRES_DB: servicehub
    ports: ['127.0.0.1:5432:5432']
    volumes: ['servicehub_postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servicehub -d servicehub']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  servicehub_postgres:
